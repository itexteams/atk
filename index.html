<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lí - THPT ATK Tân Trào</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b3cb3; /* Màu xanh nền viền ngoài giống ảnh */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background-color: #f3f4f9; /* Màu nền trắng xám bên trong */
            width: 100%;
            max-width: 1100px;
            border-radius: 40px; /* Bo góc mượt mà */
            padding: 70px 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        .header {
            color: #0033cc;
            margin-bottom: 50px;
        }
        
        .header h2 {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: bold;
        }
        
        .header hr {
            width: 280px;
            margin: 10px auto 0;
            border: none;
            border-top: 3px solid #0033cc;
        }
        
        .title {
            color: #e60000;
            margin-bottom: 60px;
            line-height: 1.5;
        }
        
        .title h2 {
            font-size: 26px;
            font-weight: bold;
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Tự động xuống dòng nếu màn hình nhỏ */
            gap: 20px;
        }
        
        .btn {
            background-color: #0b3cb3;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 28px;
            border-radius: 12px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .btn:hover {
            background-color: #082980; /* Màu tối hơn khi di chuột vào */
            transform: translateY(-3px); /* Hiệu ứng nảy lên nhẹ */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>SỞ GIÁO DỤC VÀ ĐÀO TẠO TUYÊN QUANG</h2>
            <h1>TRƯỜNG THPT ATK TÂN TRÀO</h1>
            <hr>
        </div>

        <div class="title">
            <h2>HỆ THỐNG QUẢN LÍ</h2>
            <h2>SỔ GHI CHÉP NỘI DUNG CÁC HOẠT ĐỘNG CỦA TỔ CHUYÊN MÔN</h2>
        </div>

        <div class="button-group">
            <a href="https://itexteams.github.io/toantin/" target="_blank" class="btn">Tổ Toán - Tin</a>
            <a href="https://itexteams.github.io/vananh/" target="_blank" class="btn">Tổ Văn - Anh</a>
            <a href="https://itexteams.github.io/sudia" target="_blank" class="btn">Tổ Sử - Địa</a>
            <a href="https://itexteams.github.io/lihoa" target="_blank" class="btn">Tổ Lí - Hóa</a>
            <a href="https://itexteams.github.io/vanphong/" target="_blank" class="btn">Tổ Văn phòng</a>
        </div>
    </div>

</body>
</html>
